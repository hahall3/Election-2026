# Election 2026 Initiative — discover, fetch, merge, build, deploy (GitHub Pages)
name: Election 2026 Initiative Results

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-results]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: election-results
  cancel-in-progress: false

env:
  TOTAL_WORKERS: 4
  ELECTION_DAY: '2026-11-03'
  PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/races.json

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover races (single nationwide search)
        working-directory: ${{ github.workspace }}
        env:
          SEARCH_TIMEOUT_MS: 120000
          SEARCH_RETRIES: 3
        run: node scripts/discover.mjs

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: data/manifest.json
          retention-days: 1

  fetch:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest
          path: data/

      - name: Fetch shard
        working-directory: ${{ github.workspace }}
        timeout-minutes: 8
        env:
          WORKER_ID: ${{ matrix.worker }}
          FETCH_CONCURRENCY: 2
          FETCH_BUDGET_MS: 240000
          REQUEST_TIMEOUT_MS: 20000
          REQUEST_GAP_MS: 150
          BREAKER_LIMIT: 25
          MAX_RETRIES: 2
        run: node scripts/fetch.mjs

      - name: Upload shard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.worker }}
          path: data/races-${{ matrix.worker }}.json
          if-no-files-found: warn
          retention-days: 1

  build-deploy:
    needs: fetch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here: setup-node fails hard when no lockfile is committed.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download shards
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shard-artifacts/

      - name: Merge shards
        working-directory: ${{ github.workspace }}
        run: node scripts/merge.mjs

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f package.json ]; then
            echo "::error::package.json not found in $(pwd). Files at repo root:"
            ls -la
            exit 1
          fi
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No package-lock.json committed; using npm install. Commit a lockfile for reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Build
        working-directory: ${{ github.workspace }}
        run: |
          npm run build
          if [ ! -d dist ]; then
            echo "::error::Build did not produce dist/. Check build.outDir in vite.config.js."
            exit 1
          fi
          mkdir -p dist/data
          cp data/races.json dist/data/races.json
          node -e "const j=require('./dist/data/races.json');console.log('Publishing',j.count,'races updated',j.updated)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
