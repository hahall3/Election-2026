name: Update results

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    strategy:
      # Runs 8 parallel matrix workers simultaneously
      max-parallel: 8
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch race data for assigned worker
        run: node scripts/fetch.mjs
        env:
          WORKER_ID: ${{ matrix.worker }}
          TOTAL_WORKERS: 8

      - name: Upload worker shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: races-shard-${{ matrix.worker }}
          path: data/races-${{ matrix.worker }}.json

  merge-data:
    needs: fetch-data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all worker artifacts
        uses: actions/download-artifact@v4
        with:
          path: shard-artifacts

      - name: Merge shard JSON files into data/races.json
        run: node scripts/merge.mjs

      - name: Commit and push combined result
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/races.json
          git commit -m "Update combined race data" || echo "No changes to commit"
          git push
