name: Update and Deploy Dashboard

# Election 2026 Initiative — sharded results fetch, merge, commit, and Pages deploy.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Never cancel a run mid-deploy or mid-push. GitHub keeps at most one pending
# run in the group, so a slow run simply absorbs the next cron tick.
concurrency:
  group: election-dashboard
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (only if package.json exists)
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            echo "No package.json - skipping install."
          fi

      - name: Fetch race data for worker
        id: fetch
        working-directory: ${{ github.workspace }}
        run: node scripts/fetch.mjs
        env:
          WORKER_ID: ${{ matrix.worker }}
          TOTAL_WORKERS: 8

      - name: Guarantee shard file exists
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p data
          SHARD="data/races-${{ matrix.worker }}.json"
          if [ ! -s "$SHARD" ]; then
            echo "::warning::Worker ${{ matrix.worker }} produced no shard (fetch outcome: ${{ steps.fetch.outcome }}). Writing empty shard."
            echo '[]' > "$SHARD"
          fi
          echo "Shard $SHARD: $(wc -c < "$SHARD") bytes"

      - name: Upload worker shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: races-shard-${{ matrix.worker }}
          path: data/races-${{ matrix.worker }}.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  merge-and-deploy:
    needs: fetch-data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (only if package.json exists)
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            echo "No package.json - skipping install."
          fi

      - name: Download worker artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: races-shard-*
          path: shard-artifacts
          merge-multiple: true

      - name: List downloaded shards
        working-directory: ${{ github.workspace }}
        run: ls -la shard-artifacts || echo "::warning::No shard artifacts downloaded."

      - name: Merge shard JSON files into data/races.json
        working-directory: ${{ github.workspace }}
        run: node scripts/merge.mjs

      - name: Build frontend static assets
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf dist
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            echo "Running Vite build (npm run build)."
            npm run build
          else
            echo "No build script - staging static site into dist/."
            mkdir -p dist
            cp index.html dist/
            for item in assets css js img images favicon.ico 404.html; do
              if [ -e "$item" ]; then cp -r "$item" dist/; fi
            done
          fi
          touch dist/.nojekyll

      - name: Ensure output directory and copy races.json
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist/data
          cp data/races.json dist/data/races.json
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          ls -la dist dist/data

      - name: Commit updated data back to git
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/races.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update combined race data [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push data/races.json after 3 attempts. Pages deploy continues."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
